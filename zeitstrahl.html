<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Geschichte – Epochen im Zeitstrahl</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d1b2a;
      --surface: #1b2d42;
      --surface2: #243447;
      --text: #e8edf3;
      --text-muted: #8fa4bc;
      --radius: 12px;
      --timeline-h: 42px;
    }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 18px;
      line-height: 1.6;
    }
    .page {
      max-width: 960px;
      margin: 0 auto;
      padding: 32px 20px 60px;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      text-align: center;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .subtitle {
      text-align: center;
      color: var(--text-muted);
      font-size: 1rem;
      margin-bottom: 40px;
    }
    .timeline-wrapper {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 24px 20px 16px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .timeline-scroll {
      width: 3000px;
      position: relative;
    }
    .year-axis {
      position: relative;
      height: 22px;
      margin-bottom: 2px;
    }
    .year-label {
      position: absolute;
      font-size: 0.68rem;
      color: var(--text-muted);
      transform: translateX(-50%);
      white-space: nowrap;
      bottom: 2px;
    }
    /* Tick marks row (between labels and axis-line) */
    .tick-row {
      position: relative;
      height: 12px;
    }
    .tick-cent {
      position: absolute;
      bottom: 0;
      width: 2px;
      height: 12px;
      background: rgba(180,210,255,0.55);
      transform: translateX(-50%);
    }
    .tick-dec {
      position: absolute;
      bottom: 0;
      width: 1px;
      height: 7px;
      background: rgba(180,210,255,0.25);
      transform: translateX(-50%);
    }
    .axis-line {
      height: 2px;
      background: linear-gradient(to right, #2a4a6e, #4a90d9, #2a4a6e);
      border-radius: 1px;
      margin-bottom: 10px;
    }
    /* Vertical grid lines overlaid on the epoch rows */
    .grid-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .grid-cent {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1px;
      background: rgba(180,210,255,0.13);
    }
    .grid-dec {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1px;
      background: rgba(180,210,255,0.05);
    }
    .epochs {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-bottom: 4px;
      position: relative; /* needed for grid-overlay z-index */
    }
    .epoch-row {
      height: var(--timeline-h);
      position: relative;
      width: 100%;
    }
    .epoch-bar {
      position: absolute;
      top: 0;
      height: 100%;
      border-radius: 8px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      cursor: pointer;
      transition: filter 0.18s ease, transform 0.18s ease;
      overflow: hidden;
      min-width: 24px;
    }
    .epoch-bar:hover, .epoch-bar:focus {
      filter: brightness(1.25);
      transform: scaleY(1.06);
      outline: none;
      z-index: 10;
    }
    .epoch-bar.active {
      filter: brightness(1.35);
      box-shadow: 0 0 0 3px #fff4, 0 4px 18px #0006;
      z-index: 20;
    }
    .epoch-bar span {
      font-size: 0.8rem;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 1px 3px #0006;
      pointer-events: none;
    }
    .year-axis-bottom {
      display: flex;
      justify-content: space-between;
      padding-top: 6px;
    }
    .info-panel {
      margin-top: 28px;
      background: var(--surface2);
      border-radius: var(--radius);
      padding: 28px;
      display: none;
      animation: fadeSlideIn 0.3s ease both;
    }
    .info-panel.visible {
      display: flex;
      gap: 24px;
      align-items: flex-start;
      flex-wrap: wrap;
    }
    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .info-image-wrap {
      flex: 0 0 200px;
    }
    .info-image-wrap img {
      width: 200px;
      height: 150px;
      object-fit: cover;
      border-radius: 10px;
      display: block;
      background: #1a3050;
    }
    .info-image-caption {
      font-size: 0.68rem;
      color: var(--text-muted);
      margin-top: 6px;
      text-align: center;
      line-height: 1.3;
    }
    .info-text {
      flex: 1;
      min-width: 220px;
    }
    .info-era-label {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 3px 10px;
      border-radius: 20px;
      margin-bottom: 10px;
      color: #fff;
    }
    .info-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .info-years {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 14px;
    }
    .info-desc {
      font-size: 1rem;
      line-height: 1.7;
      color: #ccd8e5;
    }
    .hint {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 16px;
    }
    .footer {
      margin-top: 50px;
      text-align: center;
      font-size: 0.78rem;
      color: var(--text-muted);
    }
    @media (max-width: 640px) {
      h1 { font-size: 1.3rem; }
      .info-panel.visible { flex-direction: column; }
      .info-image-wrap { flex: none; width: 100%; }
      .info-image-wrap img { width: 100%; height: 180px; }
    }
  </style>
</head>
<body>
<div class="page">
  <h1>📜 Epochen der Geschichte</h1>
  <p class="subtitle">Tippe auf einen bunten Balken, um mehr zu erfahren.</p>

  <div class="timeline-wrapper">

    </div>
  </div>
  <p style="text-align:center; color:#8fa4bc; font-size:0.85rem; margin-top:8px;">← Wische oder scrolle, um den ganzen Zeitstrahl zu sehen →</p>

  <p class="hint" id="hint">👆 Tippe auf eine Epoche</p>

  <div class="info-panel" id="infoPanel" role="region" aria-live="polite">
    <div class="info-image-wrap">
      <img id="infoImg" src="" alt="" />
      <p class="info-image-caption" id="infoCaption"></p>
    </div>
    <div class="info-text">
      <span class="info-era-label" id="infoLabel"></span>
      <h2 class="info-title" id="infoTitle"></h2>
      <p class="info-years" id="infoYears"></p>
      <div class="info-desc" id="infoDesc"></div>
    </div>
  </div>

  <div class="footer">
    Bilder: Wikimedia Commons (CC-Lizenz / Public Domain) | Für den Schulunterricht
  </div>
</div>

const numRows = Math.max(...epochs.map(e => e.row)) + 1;

function buildYearAxis(id) {
  const c = document.getElementById(id);
  for (let y = 0; y <= 2000; y += 100) {
    const pct = (y / 2000) * 100;
    const s = document.createElement("span");
    s.className = "year-label";
    s.textContent = y === 0 ? "0" : y;
    s.style.left = pct + "%";
    c.appendChild(s);
  }
}

function buildTicksAndGrid() {
  const scroll = document.querySelector(".timeline-scroll");
  const axisLine = document.querySelector(".axis-line");

  // ── Tick-row: inserted between year-axis and axis-line ──
  const tickRow = document.createElement("div");
  tickRow.className = "tick-row";
  scroll.insertBefore(tickRow, axisLine);

  for (let y = 0; y <= 2000; y += 10) {
    const isCent = y % 100 === 0;
    const tick = document.createElement("div");
    tick.className = isCent ? "tick-cent" : "tick-dec";
    tick.style.left = (y / 2000 * 100) + "%";
    tickRow.appendChild(tick);
  }

  // ── Grid overlay: behind the epoch bars ──
  const epochsEl = document.getElementById("epochsContainer");
  const grid = document.createElement("div");
  grid.className = "grid-overlay";
  epochsEl.insertBefore(grid, epochsEl.firstChild);

  for (let y = 0; y <= 2000; y += 10) {
    const isCent = y % 100 === 0;
    const line = document.createElement("div");
    line.className = isCent ? "grid-cent" : "grid-dec";
    line.style.left = (y / 2000 * 100) + "%";
    grid.appendChild(line);
  }
}

buildYearAxis("yearAxisTop");
buildTicksAndGrid();

const container = document.getElementById("epochsContainer");
const rowDivs = [];
for (let r = 0; r < numRows; r++) {
  const row = document.createElement("div");
  row.className = "epoch-row";
  container.appendChild(row);
  rowDivs.push(row);
}

epochs.forEach(epoch => {
  const row = rowDivs[epoch.row];
  const bar = document.createElement("div");
  bar.className = "epoch-bar";
  bar.setAttribute("tabindex", "0");
  bar.setAttribute("role", "button");
  bar.setAttribute("aria-label", epoch.name + " – tippen für mehr Infos");
  const leftPct  = ((epoch.start - TOTAL_START) / TOTAL_SPAN) * 100;
  const widthPct = ((epoch.end   - epoch.start)  / TOTAL_SPAN) * 100;
  bar.style.left    = leftPct + "%";
  bar.style.width   = widthPct + "%";
  bar.style.background = epoch.color;
  const label = document.createElement("span");
  label.textContent = epoch.name;
  bar.appendChild(label);
  bar.addEventListener("click",   () => showEpoch(epoch, bar));
  bar.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); showEpoch(epoch, bar); }
  });
  row.appendChild(bar);
});

let activeBar = null;
function showEpoch(epoch, bar) {
  if (activeBar) activeBar.classList.remove("active");
  activeBar = bar;
  bar.classList.add("active");
  document.getElementById("infoImg").src = epoch.img;
  document.getElementById("infoImg").alt = epoch.title;
  document.getElementById("infoCaption").textContent = epoch.caption;
  document.getElementById("infoLabel").textContent = epoch.name;
  document.getElementById("infoLabel").style.background = epoch.color;
  document.getElementById("infoTitle").textContent = epoch.title;
  document.getElementById("infoYears").textContent = epoch.yearsText;
  document.getElementById("infoDesc").innerHTML = "<p>" + epoch.desc + "</p>";
  const panel = document.getElementById("infoPanel");
  panel.classList.remove("visible");
  void panel.offsetWidth;
  panel.classList.add("visible");
  document.getElementById("hint").style.display = "none";
  panel.scrollIntoView({ behavior: "smooth", block: "nearest" });
}
</script>
